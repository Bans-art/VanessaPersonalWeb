<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>

    <title>Contacts</title>
    <style>
        /* Base Navigation Bar Design matching Home Page */
        .navbar {
            background-color: #0f172a !important;
            padding: 14px 0;
            text-align: center;
            border-radius: 8px;
            user-select: none;
        }

        .navbar a {
            color: #94a3b8 !important;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
            font-size: 16px;
            padding: 8px 16px;
            border-radius: 6px;
            display: inline-block;
            transition: all 0.25s ease;
        }

        /* Hover animation ONLY for non-active buttons */
        .navbar a:hover:not(.active) {
            color: #ffffff !important;
            background-color: rgba(255, 255, 255, 0.12) !important;
            transform: translateY(-1px);
        }

        /* LOCKED ACTIVE HIGHLIGHT (CONTACTS IS ACTIVE HERE) */
        .navbar a.active {
            color: #ffffff !important;
            background-color: #3498db !important;
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3) !important;
            cursor: default;
        }
    </style>
</head>
<body style="position: relative; min-height: 100vh; font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f7f6; color: #333; max-width: 1200px; margin: 0 auto; padding: 20px; padding-bottom: 100px;">
