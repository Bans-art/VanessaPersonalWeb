<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .calculator-card {
            background: linear-gradient(to bottom, #f3f3f3, #e6e6e6);
            border: 1px solid #d3d3d3;
            border-radius: 4px;
            padding: 30px;
            width: 680px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
        }

        h2 {
            text-align: center;
            color: #4a4a4a;
            font-weight: 400;
            margin-top: 0;
            margin-bottom: 30px;
            font-size: 32px;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        .row {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .input-field {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            color: #555;
        }

        .input-field::placeholder {
            color: #b3b3b3;
        }

        /* Operator Buttons */
        .op-btn {
            flex: 1;
            padding: 10px 0;
            background: linear-gradient(to bottom, #428bca, #3071a9);
            color: white;
            border: 1px solid #2c6699;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            text-shadow: 0 -1px 0 rgba(0,0,0,0.2);
        }

        .op-btn:hover {
            background: #3071a9;
        }

        /* Result & Clear Row Styling */
        .result-container {
            display: flex;
            gap: 15px;
            margin-bottom: 0;
        }

        .result-field {
            flex: 2.75;
            padding: 12px;
            border: 1px solid #dcdcdc;
            border-radius: 4px;
            background-color: #eee;
            font-size: 14px;
            color: #777;
        }

        .clear-btn {
            flex: 1.25;
            padding: 10px 0;
            background: linear-gradient(to bottom, #d9534f, #c9302c);
            color: white;
            border: 1px solid #c9302c;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .clear-btn:hover {
            background: #c9302c;
        }
    </style>
</head>
<body>

<div class="calculator-card">
    <h2>Simple calculator</h2>
    
    <!-- Inputs -->
    <div class="row">
        <input type="number" id="num1" class="input-field" placeholder="NUMBER e.g. 1337">
        <input type="number" id="num2" class="input-field" placeholder="NUMBER e.g. 2108">
    </div>

    <!-- Operators -->
    <div class="row">
        <button class="op-btn" data-op="+">+ Add</button>
        <button class="op-btn" data-op="-">- Subtract</button>
        <button class="op-btn" data-op="/">/ Divide</button>
        <button class="op-btn" data-op="*">* Multiply</button>
    </div>

    <!-- Result / Clear -->
    <div class="result-container">
        <input type="text" id="result" class="result-field" placeholder="Result" readonly>
        <button id="clearBtn" class="clear-btn">Clear</button>
    </div>
</div>

<script>
    const num1Input = document.getElementById('num1');
    const num2Input = document.getElementById('num2');
    const resultInput = document.getElementById('result');
    const clearButton = document.getElementById('clearBtn');
    const operatorButtons = document.querySelectorAll('.op-btn');

    // Attach click events to all operation buttons
    operatorButtons.forEach(button => {
        button.addEventListener('click', () => {
            const val1 = parseFloat(num1Input.value);
            const val2 = parseFloat(num2Input.value);
            const operation = button.getAttribute('data-op');

            // Quick validation Check
            if (isNaN(val1) || isNaN(val2)) {
                resultInput.value = "Error: Please enter both numbers";
                return;
            }

            let outcome;
            switch (operation) {
                case '+': outcome = val1 + val2; break;
                case '-': outcome = val1 - val2; break;
                case '*': outcome = val1 * val2; break;
                case '/': 
                    outcome = (val2 === 0) ? "Cannot divide by zero" : val1 / val2; 
                    break;
                default: outcome = "";
            }

            // Clean up long floating point decimals if necessary
            if (typeof outcome === 'number' && !Number.isInteger(outcome)) {
                outcome = Math.round(outcome * 1000000) / 1000000;
            }

            resultInput.value = outcome;
        });
    });

    // Clear function resets all input fields
    clearButton.addEventListener('click', () => {
        num1Input.value = '';
        num2Input.value = '';
        resultInput.value = '';
    });
</script>

</body>
</html>
